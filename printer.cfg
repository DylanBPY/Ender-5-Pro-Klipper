# This file contains pin mappings for the Creality "v4.2.7" board. To
# use this config, during "make menuconfig" select the STM32F103 with
# a "28KiB bootloader" and serial (on USART1 PA10/PA9) communication.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PB9
dir_pin: !PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PB7
dir_pin: !PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 195
homing_speed: 50

[stepper_z]
step_pin: PB5
dir_pin: PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 4
endstop_pin: ^PA7
position_min: -0.430
position_endstop: -0.430
position_max: 320
homing_speed: 5

[bltouch]
sensor_pin = ^PB1
control_pin = PB0
z_offset: 1.513
x_offset = 30
y_offset = 40
samples: 2
samples_tolerance_retries: 3
stow_on_each_sample: false

[safe_z_home]
home_xy_position: 0,0
speed: 75
z_hop: 3
z_hop_speed: 5

[bed_mesh]
speed: 175
horizontal_move_z: 3
mesh_min: 30,40
mesh_max: 170,165
probe_count: 5,5
algorithm: bicubic

[input_shaper]
shaper_freq_x: 48.649
shaper_freq_y: 30.337

[extruder]
max_extrude_only_distance: 100.0
step_pin: PB3
dir_pin: PB4
enable_pin: !PC3
microsteps: 16
gear_ratio: 3.5:1
rotation_distance: 26.780592
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
pressure_advance: 0.044
min_temp: 0
max_temp: 300
min_extrude_temp: 180
control: pid
pid_Kp: 19.758 
pid_Ki: 1.208 
pid_Kd: 80.761

[firmware_retraction]
retract_length: 2.5
retract_speed: 80
unretract_extra_length: 0
unretract_speed: 80

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 65.595
pid_Ki: 1.110
pid_Kd: 969.159
min_temp: 0
max_temp: 130

[screws_tilt_adjust]
screw1: 15,13
screw1_name: back right screw
screw2: 180,13
screw2_name: back left screw
screw3: 15,170
screw3_name: front right screw
screw4: 180,170
screw4_name: front left screw
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4

[bed_screws]
screw1: 15,13
screw2: 180,13
screw3: 15,170
screw4: 180,170

[fan]
pin: PA0

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 800
max_accel: 10000
max_z_velocity: 17
max_z_accel: 50
square_corner_velocity: 1

[gcode_arcs]
resolution: 0.1

[virtual_sdcard]
path: /home/dylan/printer_data/gcodes

[idle_timeout]
timeout: 12600

[exclude_object]

[include mainsail.cfg]
[include macros.cfg]
[include KAMP_Settings.cfg]